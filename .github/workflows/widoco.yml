name: Generate PLATO Documentation

# This workflow generates Widoco documentation and deploys it to the gh-pages branch.
# GitHub's automatic "pages-build-deployment" action will then publish the gh-pages
# branch to GitHub Pages. This two-step process is normal and expected.

on:
  push:
    branches:
      - main
    paths:
      - 'ontology.ttl'
      - 'README.md'
      - 'examples/**'
      - 'schemas/**'
      - 'docs/**'
      - '.github/workflows/widoco.yml'
      - 'scripts/build_releases.py'
    # A release tag must rebuild, so that releases/X.Y.Z/ appears. PLATO tags
    # after pushing the release commit to main, and that main push has
    # usually started (without the tag) before the tag exists. GitHub does
    # not evaluate the paths filter above for tag pushes, so every v* tag
    # triggers a run.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual documentation refresh'

# Required for peaceiris/actions-gh-pages to push to gh-pages branch
permissions:
  contents: write

# Every run force-pushes a fresh gh-pages, so the last to finish wins. Queue
# runs rather than race them: otherwise the main push for a release, still
# building without the tag, can finish after the tag's run and publish a site
# with no releases/X.Y.Z/. A queued run replaces an older queued one, which is
# harmless because each run rebuilds everything from main and all tags.
concurrency:
  group: gh-pages-docs
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history, which brings every tag: the releases/ copies are
          # read with `git show vX.Y.Z:ontology.ttl`. The default depth of 1
          # fetches no tags, and build_releases.py would publish none.
          fetch-depth: 0
          # A tag push would otherwise check out the tag, and publish that
          # release's ontology as the current one at the site root even if
          # main has moved on. Always build the site from main on a tag push;
          # otherwise keep the default (the ref that triggered the run).
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Latest Widoco
        env:
          # Authenticate the API query. Unauthenticated calls share a per-IP
          # quota across all Actions runners and are routinely rate-limited,
          # which returns a JSON error object with no .assets key and makes
          # this step fail intermittently.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dgarijo/Widoco/releases/latest)

          LATEST_URL=$(printf '%s' "$RESPONSE" \
            | jq -r '.assets[]? | select(.name | endswith(".jar")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$LATEST_URL" ] || [ "$LATEST_URL" = "null" ]; then
            echo "Error: Could not find Widoco JAR. API response was:"
            printf '%s\n' "$RESPONSE" | head -20
            exit 1
          fi

          # No auth header here: the asset URL redirects to a signed storage
          # host that rejects requests carrying an Authorization header.
          echo "Downloading from: $LATEST_URL"
          curl -sSL --fail --retry 3 --retry-delay 5 "$LATEST_URL" -o widoco.jar
          echo "JAR size: $(stat --printf='%s' widoco.jar) bytes"

      - name: Run Widoco
        run: |
          java -jar widoco.jar \
            -ontFile ontology.ttl \
            -outFolder ./widoco-output \
            -rewriteAll \
            -uniteSections \
            -webVowl \
            -includeImportedOntologies \
            -lang en \
            -noPlaceHolderText || true

          # Widoco sometimes exits non-zero even on success, so check output
          echo "=== Widoco output structure ==="
          find ./widoco-output -type f | head -40

      - name: Prepare publish directory
        run: |
          # Widoco typically puts index.html inside a subdirectory
          # named after the ontology file, or directly in outFolder.
          # We need to find where index.html actually landed.

          if [ -f ./widoco-output/index-en.html ]; then
            echo "Found index-en.html at top level"
            PUBLISH_DIR=./widoco-output
          elif [ -f ./widoco-output/doc/index-en.html ]; then
            echo "Found index-en.html in doc/"
            PUBLISH_DIR=./widoco-output/doc
          elif [ -f ./widoco-output/index.html ]; then
            echo "Found index.html at top level"
            PUBLISH_DIR=./widoco-output
          else
            echo "=== Full output tree ==="
            find ./widoco-output -type f
            echo "ERROR: No index file found in Widoco output"
            exit 1
          fi

          # Create a proper index.html that redirects to index-en.html
          # (Widoco generates index-en.html, not index.html)
          if [ -f "$PUBLISH_DIR/index-en.html" ] && [ ! -f "$PUBLISH_DIR/index.html" ]; then
            cat > "$PUBLISH_DIR/index.html" << 'EOF'
          <!DOCTYPE html>
          <html><head>
          <meta http-equiv="refresh" content="0; url=index-en.html">
          </head><body>
          <p>Redirecting to <a href="index-en.html">documentation</a>...</p>
          </body></html>
          EOF
          fi

          # Publish the JSON Schemas and the JSON-LD context beside the docs.
          # raw.githubusercontent.com serves them as text/plain, which a
          # spec-conformant JSON-LD processor (jsonld.js) will not parse as a
          # remote context; GitHub Pages serves .jsonld as application/ld+json
          # and .json as application/json, with CORS. w3id.org/plato/schemas/*
          # is meant to redirect here.
          mkdir -p "$PUBLISH_DIR/schemas"
          cp -r schemas/. "$PUBLISH_DIR/schemas/"

          # Replace Widoco's re-serialisations of the ontology with ones made
          # directly from the source, so that every negotiated form of
          # w3id.org/plato is the same graph. Widoco's OWL API output keeps the
          # source triples but adds about 65 declarations of external terms,
          # one of them wrong (geo:wktLiteral typed as owl:Class). The Turtle is
          # the source file itself, comments included; Pages serves it as
          # text/turtle, which raw.githubusercontent.com does not.
          python3 -m venv /tmp/rdf
          /tmp/rdf/bin/pip install --quiet rdflib==7.6.0   # pinned: releases/X.Y.Z/ files must keep the same bytes from one deploy to the next
          cp ontology.ttl "$PUBLISH_DIR/ontology.ttl"
          /tmp/rdf/bin/python - "$PUBLISH_DIR" << 'PY'
          import sys
          from rdflib import Graph
          from rdflib.compare import to_isomorphic
          out = sys.argv[1]
          g = Graph()
          g.parse("ontology.ttl", format="turtle")
          for name, fmt in [("ontology.nt", "nt"), ("ontology.owl", "xml"), ("ontology.jsonld", "json-ld")]:
              g.serialize(destination=f"{out}/{name}", format=fmt)
              h = Graph()
              h.parse(f"{out}/{name}", format=fmt)
              assert to_isomorphic(g) == to_isomorphic(h), name
              print(f"{name}: {len(h)} triples, isomorphic with ontology.ttl")
          PY

          # A fixed copy of every release, from its tag, at
          # releases/X.Y.Z/ontology.{ttl,nt,owl,jsonld}, plus releases/index.json.
          # w3id.org/plato/X.Y.Z redirects here, so these paths are permanent:
          # rename nothing. The Turtle is the tagged file byte for byte; the
          # others are made and checked exactly as above. A tag whose ontology
          # is missing or does not parse is skipped with a ::warning:: and left
          # out of index.json rather than failing the deploy.
          /tmp/rdf/bin/python scripts/build_releases.py "$PUBLISH_DIR"

          # Build the PLATO guide (Sphinx, docs/) into guide/. Its reference
          # pages, template workbook and download zips are generated from
          # ontology.ttl and schemas/tables/ during the build. -W fails the
          # deploy on any warning, so a broken link or include never goes live.
          /tmp/rdf/bin/pip install --quiet -r docs/requirements.txt
          /tmp/rdf/bin/sphinx-build -W --keep-going -q -b html docs "$PUBLISH_DIR/guide"

          # Point newcomers at the guide from the top of Widoco's formal reference.
          /tmp/rdf/bin/python - "$PUBLISH_DIR/index-en.html" << 'PY'
          import sys
          path = sys.argv[1]
          html = open(path, encoding="utf-8").read()
          banner = ('<p style="background:#fff4d6;border:1px solid #e0c36a;border-radius:6px;'
                    'padding:10px 14px;font-size:1.05em">New to PLATO? '
                    '<a href="guide/"><strong>Start with the guide</strong></a>: why PLATO, and how to organise '
                    'data about places in an ordinary spreadsheet. This page is the formal reference.</p>')
          assert "</h1>" in html, "Widoco page has no </h1> to put the guide link after"
          open(path, "w", encoding="utf-8").write(html.replace("</h1>", "</h1>" + banner, 1))
          print("guide link added to index-en.html")
          PY

          # Verify
          echo "=== Files in publish dir ==="
          ls -la "$PUBLISH_DIR"/ | head -20

          # Set output for next step
          echo "PUBLISH_DIR=$PUBLISH_DIR" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          force_orphan: true